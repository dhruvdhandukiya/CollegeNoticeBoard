name: college_noticeboard
description: Role-Based College Noticeboard App with Smart Notice Intelligence
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  firebase_storage: ^11.6.0       # For PDF uploads on events

  # Google Calendar
  google_sign_in: ^6.2.1
  googleapis: ^11.4.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

  # State Management
  provider: ^6.1.2

  # UI / UX
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  # File picking and PDF viewing
  file_picker: ^8.0.3             # Admin picks PDF from device
  flutter_pdfview: ^1.3.2         # Students view PDF in-app
  path_provider: ^2.1.2           # Temp file path for PDF viewer

  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3
  http: ^1.2.1
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true