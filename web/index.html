<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="College Noticeboard App">
  <title>College Noticeboard</title>
</head>
<body>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <script>
    window.gCalToken     = null;
    window.gCalExpiry    = null;

    window.requestCalendarToken = function(clientId, callback) {
      console.log('GIS: requestCalendarToken called with clientId:', clientId);

      if (!clientId || clientId !== '174103157478-fh80l432rsdqj5ph3dpvgpt686umpenb.apps.googleusercontent.com') {
        console.error('GIS: Invalid client ID! Update _webClientId in calendar_service.dart');
        callback('error: invalid client ID - update _webClientId in calendar_service.dart');
        return;
      }

      try {
        var tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: clientId,
          scope: 'https://www.googleapis.com/auth/calendar.events',
          callback: function(response) {
            console.log('GIS callback response:', response);
            if (response && response.access_token) {
              window.gCalToken  = response.access_token;
              window.gCalExpiry = Date.now() + 3500000; // ~58 min
              console.log('GIS: token stored successfully');
              callback('ok');
            } else if (response && response.error) {
              console.error('GIS error:', response.error);
              callback('error: ' + response.error);
            } else {
              console.error('GIS: unknown response', response);
              callback('error: unknown response');
            }
          },
          error_callback: function(err) {
            console.error('GIS error_callback:', err);
            // popup_closed is when user closes the popup — not a hard error
            if (err && err.type === 'popup_closed') {
              callback('error: popup_closed_by_user');
            } else {
              callback('error: ' + (err ? JSON.stringify(err) : 'unknown'));
            }
          }
        });

        // Open the consent popup
        tokenClient.requestAccessToken({ prompt: '' });

      } catch(e) {
        console.error('GIS exception:', e);
        callback('exception: ' + e.toString());
      }
    };

    /** Called from Dart to read the stored token */
    window.getCalendarToken = function() {
      if (!window.gCalToken)  return null;
      if (!window.gCalExpiry) return null;
      if (Date.now() > window.gCalExpiry) {
        window.gCalToken  = null;
        window.gCalExpiry = null;
        return null;
      }
      return window.gCalToken;
    };

    /** Called from Dart on sign-out */
    window.clearCalendarToken = function() {
      window.gCalToken  = null;
      window.gCalExpiry = null;
      console.log('GIS: token cleared');
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
